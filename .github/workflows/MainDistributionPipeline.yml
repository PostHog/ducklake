#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  get-duckdb-version:
    name: Get DuckDB version
    runs-on: ubuntu-latest
    outputs:
      duckdb_version: ${{ steps.version.outputs.duckdb_version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          sparse-checkout: .github
      - id: version
        run: echo "duckdb_version=$(cat .github/duckdb-version)" >> $GITHUB_OUTPUT

  duckdb-next-build:
    name: Build extension binaries
    needs: get-duckdb-version
    # Vendored copy of duckdb/extension-ci-tools _extension_distribution.yml (v1.5.2);
    # see .github/workflows/_extension_distribution.yml for source SHA and rationale.
    uses: ./.github/workflows/_extension_distribution.yml
    with:
      duckdb_version: ${{ needs.get-duckdb-version.outputs.duckdb_version }}
      ci_tools_version: v1.5-variegata
      extension_name: ducklake
      opt_in_archs: 'linux_arm64_musl;linux_amd64_musl'

  # Regression test, see https://github.com/duckdb/ducklake/pull/1256 for more details.
  gcc12-compatibility-build:
    name: Build with GCC 12
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      VCPKG_TARGET_TRIPLET: x64-linux
      GEN: Ninja
      VCPKG_TOOLCHAIN_PATH: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
      CC: gcc-12
      CXX: g++-12
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - name: Install required ubuntu packages
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y -qq build-essential gcc-12 g++-12 cmake ninja-build ccache python3 mold

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          submodules: 'true'

      - name: Checkout DuckDB to version
        run: |
          cd duckdb
          git checkout $(cat ../.github/duckdb-version)

      - name: Setup Ccache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          key: gcc12-compatibility-build
          save: ${{ github.ref == 'refs/heads/main' || github.repository != 'duckdb/ducklake' }}

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@abed23940f9d7bc267b0e1a21ee7b699a3794baa # v11.1
        with:
          vcpkgGitCommitId: a42af01b72c28a8e1d7b48107b33e4f286a55ef6

      - name: Build extension
        run: |
          make release

  duckdb-next-deploy:
    name: Deploy extension binaries
    needs: [get-duckdb-version, duckdb-next-build, gcc12-compatibility-build]
    # Only the duckdb org holds the nightly S3 credentials; skip elsewhere.
    if: github.ref != 'refs/heads/main' && github.repository_owner == 'duckdb'
    # Vendored copy of duckdb/extension-ci-tools _extension_deploy.yml (v1.5.2);
    # see .github/workflows/_extension_deploy.yml for source SHA and rationale.
    uses: ./.github/workflows/_extension_deploy.yml
    secrets:
      DUCKDB_EXTENSIONS_NIGHTLY_S3_ENDPOINT: ${{ secrets.DUCKDB_EXTENSIONS_NIGHTLY_S3_ENDPOINT }}
      DUCKDB_EXTENSIONS_NIGHTLY_S3_ID: ${{ secrets.DUCKDB_EXTENSIONS_NIGHTLY_S3_ID }}
      DUCKDB_EXTENSIONS_NIGHTLY_S3_KEY: ${{ secrets.DUCKDB_EXTENSIONS_NIGHTLY_S3_KEY }}
      S3_DUCKDB_ORG_EXTENSION_SIGNING_PK: ${{ secrets.S3_DUCKDB_ORG_EXTENSION_SIGNING_PK }}
    with:
      extension_name: ducklake
      duckdb_version: ${{ needs.get-duckdb-version.outputs.duckdb_version }}
      ci_tools_version: main
      deploy_latest: ${{ startsWith(github.ref, 'refs/heads/v') }}
      deploy_versioned: ${{ startsWith(github.ref, 'refs/heads/v') }}

  publish-github-release:
    name: Publish GitHub Release assets
    runs-on: ubuntu-latest
    needs: [get-duckdb-version, duckdb-next-build]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      DUCKDB_VERSION: ${{ needs.get-duckdb-version.outputs.duckdb_version }}
    steps:
      - name: Download linux amd64 extension
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ducklake-${{ env.DUCKDB_VERSION }}-extension-linux_amd64
          path: release-assets/linux_amd64

      - name: Download linux arm64 extension
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ducklake-${{ env.DUCKDB_VERSION }}-extension-linux_arm64
          path: release-assets/linux_arm64

      - name: Stage release assets
        run: |
          mkdir -p release-assets/staged
          cp release-assets/linux_amd64/ducklake.duckdb_extension release-assets/staged/ducklake-linux-amd64.duckdb_extension
          cp release-assets/linux_arm64/ducklake.duckdb_extension release-assets/staged/ducklake-linux-arm64.duckdb_extension
          cd release-assets/staged
          sha256sum ducklake-linux-amd64.duckdb_extension ducklake-linux-arm64.duckdb_extension > SHA256SUMS

      - name: Create or update GitHub Release
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" \
              --notes "PostHog DuckLake extension binaries for DuckDB ${DUCKDB_VERSION}."
          fi

          gh release upload "$RELEASE_TAG" \
            release-assets/staged/ducklake-linux-amd64.duckdb_extension \
            release-assets/staged/ducklake-linux-arm64.duckdb_extension \
            release-assets/staged/SHA256SUMS \
            --clobber

  relassert:
    name: Build relassert
    runs-on: ${{ github.repository_owner == 'duckdb' && 'namespace-profile-linux-x64' || 'ubuntu-latest' }}
    permissions:
      contents: read
    env:
      GEN: ninja
      CC: clang-20
      CXX: clang++-20
      VCPKG_TOOLCHAIN_PATH: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
      USE_MERGED_VCPKG_MANIFEST: 1
      # Enable -DDEBUG slow verifiers (expression verifier, operator
      # round-trips, etc.) without changing the optimization level.
      FORCE_DEBUG: 1
      FORCE_ASSERT: 1
      ASAN_OPTIONS: "detect_leaks=1:halt_on_error=1:abort_on_error=0"
      UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          submodules: 'true'
      - name: Install tools
        run: python3 duckdb/scripts/ci/retry.py -- make -C duckdb toolsci
      - name: Fix ASan runtime
        # libclang_rt.asan_static.a is missing in ubuntu 24.04 — workaround
        # mirrored from upstream Main.yml.
        run: |
          asan_static_dir="/usr/lib/llvm-20/lib/clang/20/lib/x86_64-pc-linux-gnu"
          asan_static_target="/usr/lib/llvm-20/lib/clang/20/lib/linux/libclang_rt.asan_static-x86_64.a"
          if [[ ! -e "${asan_static_dir}/libclang_rt.asan_static.a" && -e "${asan_static_target}" ]]; then
            sudo mkdir -p "${asan_static_dir}"
            sudo ln -sf "${asan_static_target}" "${asan_static_dir}/libclang_rt.asan_static.a"
          fi
      - name: Setup Ccache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          max-size: 5GB
          evict-old-files: job
      # Inlined from duckdb/duckdb-ci/build-duckdb: that composite action
      # references unpinned actions internally, which the PostHog org
      # full-SHA-pin policy rejects.
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@abed23940f9d7bc267b0e1a21ee7b699a3794baa # v11.1
        with:
          vcpkgGitCommitId: 84bab45d415d22042bd0b9081aea57f362da3f35
      - name: Build (relassert → ASan + UBSan + LSan)
        run: python3 duckdb/scripts/ci/retry.py -- make relassert
      - name: Test
        run: make unittest_relassert
