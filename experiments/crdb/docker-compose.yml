services:
  cockroach:
    image: cockroachdb/cockroach:latest-v25.2
    container_name: ducklake-crdb
    command: start-single-node --insecure
    ports:
      - "26257:26257"
      - "8089:8080"
    healthcheck:
      test: ["CMD", "cockroach", "sql", "--insecure", "-e", "SELECT 1"]
      interval: 3s
      timeout: 5s
      retries: 20
