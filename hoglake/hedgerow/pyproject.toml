[project]
name = "hedgerow"
version = "0.1.0"
description = "hoglake-native replication daemon: one source table -> one destination table, append-only, at-least-once"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyhoglake",
    "pyarrow>=17.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
metrics = ["prometheus-client>=0.20"]

[project.scripts]
hedgerow = "hedgerow.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
    "prometheus-client>=0.20",
]

[tool.uv.sources]
pyhoglake = { path = "../pyhoglake", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hedgerow"]

[tool.pytest.ini_options]
markers = [
    "integration: tests that require a live hoglake server (HOGLAKE_URL)",
]
testpaths = ["tests"]
