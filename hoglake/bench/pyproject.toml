[project]
name = "hoglake-bench"
version = "0.1.0"
description = "Stress-test / benchmark harness for the hoglake control plane"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyhoglake",
    "httpx>=0.27",
    "pyarrow>=17.0",
    "numpy>=1.26",
    "faker>=30.0",
]

[project.scripts]
hoglake-bench = "hoglake_bench.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv.sources]
pyhoglake = { path = "../pyhoglake", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hoglake_bench"]

[tool.pytest.ini_options]
markers = [
    "integration: tests that require a live hoglake server (HOGLAKE_URL)",
]
testpaths = ["tests"]
