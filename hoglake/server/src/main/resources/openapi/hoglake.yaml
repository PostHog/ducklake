openapi: 3.0.3
info:
  title: hoglake
  version: 0.1.0
  description: |
    The hoglake control plane: a Postgres-native lakehouse catalog.
    Clients never touch the backing Postgres; parquet lives in object
    storage and is written by clients, registered here via
    footer-shipping commits. Row-level deletes are deletion vectors
    (client-written puffin DVs, registered like files). Retention is a
    catalog property with a consumer-offset floor. Auth is out of scope
    for v1.

    Malformed bodies/params and unknown request fields are 400
    bad_request; semantic failures are 422.
servers:
  - url: /v1
paths:
  /catalogs:
    get:
      operationId: listCatalogs
      summary: List catalogs
      responses:
        "200":
          description: Catalogs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Catalog" }
    post:
      operationId: createCatalog
      summary: Create a catalog
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCatalogRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Catalog" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422":
          description: Validation failure (bad name, blank data_path)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /catalogs/{catalog}:
    get:
      operationId: getCatalog
      summary: Catalog info (head snapshot, schema version, data path)
      parameters: [ { $ref: "#/components/parameters/catalog" } ]
      responses:
        "200":
          description: Catalog
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Catalog" }
        "404": { $ref: "#/components/responses/NotFound" }

  /catalogs/{catalog}/namespaces:
    get:
      operationId: listNamespaces
      parameters: [ { $ref: "#/components/parameters/catalog" } ]
      responses:
        "200":
          description: Namespaces
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Namespace" }
    post:
      operationId: createNamespace
      parameters: [ { $ref: "#/components/parameters/catalog" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Namespace" }
        "409": { $ref: "#/components/responses/Conflict" }

  /catalogs/{catalog}/namespaces/{namespace}:
    get:
      operationId: getNamespace
      parameters:
        - { $ref: "#/components/parameters/catalog" }
        - { $ref: "#/components/parameters/namespace" }
      responses:
        "200":
          description: Namespace
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Namespace" }
        "404": { $ref: "#/components/responses/NotFound" }

  /catalogs/{catalog}/namespaces/{namespace}/tables:
    get:
      operationId: listTables
      parameters:
        - { $ref: "#/components/parameters/catalog" }
        - { $ref: "#/components/parameters/namespace" }
      responses:
        "200":
          description: Tables (live at head)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TableSummary" }
    post:
      operationId: createTable
      summary: Create a table (DDL commit; produces a snapshot)
      parameters:
        - { $ref: "#/components/parameters/catalog" }
        - { $ref: "#/components/parameters/namespace" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTableRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Table" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422":
          description: Validation failure (bad name, no columns,
            duplicate/unknown column types)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /catalogs/{catalog}/namespaces/{namespace}/tables/{table}:
    get:
      operationId: getTable
      summary: Table schema, identity, and stats (optionally at a snapshot)
      parameters:
        - { $ref: "#/components/parameters/catalog" }
        - { $ref: "#/components/parameters/namespace" }
        - { $ref: "#/components/parameters/table" }
        - { $ref: "#/components/parameters/snapshot" }
        - { $ref: "#/components/parameters/atTimestamp" }
      responses:
        "200":
          description: Table
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Table" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/Gone" }
    delete:
      operationId: dropTable
      summary: Drop a table (DDL commit; produces a snapshot)
      parameters:
        - { $ref: "#/components/parameters/catalog" }
        - { $ref: "#/components/parameters/namespace" }
        - { $ref: "#/components/parameters/table" }
      responses:
        "200":
          description: Dropped; returns the snapshot that recorded it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommitResult" }
        "404": { $ref: "#/components/responses/NotFound" }

  /catalogs/{catalog}/namespaces/{namespace}/tables/{table}/alter:
    post:
      operationId: alterTable
      summary: >
        Schema evolution as one DDL commit: typed ops applied atomically
        in order (add/drop/rename/promote column, rename table, set
        partition spec). Produces a snapshot with a table_altered change.
      parameters:
        - { $ref: "#/components/parameters/catalog" }
        - { $ref: "#/components/parameters/namespace" }
        - { $ref: "#/components/parameters/table" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ops]
              properties:
                ops:
                  type: array
                  minItems: 1
                  items: { $ref: "#/components/schemas/AlterOp" }
      responses:
        "200":
          description: Applied; the table after evolution
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Table" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422":
          description: Invalid op (unknown column, illegal promotion,
            duplicate name, bad spec)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /catalogs/{catalog}/namespaces/{namespace}/tables/{table}/scan:
    get:
      operationId: planScan
      summary: >
        Read planning: data files paired with their live deletion
        vectors at a snapshot.
      parameters:
        - { $ref: "#/components/parameters/catalog" }
        - { $ref: "#/components/parameters/namespace" }
        - { $ref: "#/components/parameters/table" }
        - { $ref: "#/components/parameters/snapshot" }
        - { $ref: "#/components/parameters/atTimestamp" }
      responses:
        "200":
          description: Scan plan
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ScanFile" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/Gone" }

  /catalogs/{catalog}/namespaces/{namespace}/tables/{table}/files:
    get:
      operationId: listFiles
      summary: Physical files backing the table at a snapshot (read planning)
      parameters:
        - { $ref: "#/components/parameters/catalog" }
        - { $ref: "#/components/parameters/namespace" }
        - { $ref: "#/components/parameters/table" }
        - { $ref: "#/components/parameters/snapshot" }
        - { $ref: "#/components/parameters/atTimestamp" }
      responses:
        "200":
          description: Files
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DataFile" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/Gone" }

  /catalogs/{catalog}/namespaces/{namespace}/tables/{table}/changes:
    get:
      operationId: getChanges
      summary: >
        Changefeed plan: files + row-id ranges for rows appended in
        (from_snapshot, to_snapshot]. Metadata only; the client reads the
        parquet itself. Append-only v1: insertions only.
      parameters:
        - { $ref: "#/components/parameters/catalog" }
        - { $ref: "#/components/parameters/namespace" }
        - { $ref: "#/components/parameters/table" }
        - name: from_snapshot
          in: query
          required: true
          schema: { type: integer, format: int64 }
        - name: to_snapshot
          in: query
          required: false
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Change plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangePlan" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410":
          description: >
            from_snapshot falls below the catalog's expiry floor
            (earliest_snapshot_id): part of the range is gone. The
            consumer must reconcile (re-read from a full scan) rather
            than silently skip.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /catalogs/{catalog}/options:
    get:
      operationId: getCatalogOptions
      parameters: [ { $ref: "#/components/parameters/catalog" } ]
      responses:
        "200":
          description: Options
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogOptions" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: patchCatalogOptions
      summary: >
        Update retention options. snapshot_retention_seconds null
        disables expiry; consumer_floor controls whether expiry stops at
        the min consumer offset.
      parameters: [ { $ref: "#/components/parameters/catalog" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                snapshot_retention_seconds:
                  type: integer
                  format: int64
                  nullable: true
                consumer_floor: { type: boolean }
      responses:
        "200":
          description: Updated options
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogOptions" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: Invalid values
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  /catalogs/{catalog}/maintenance/expire:
    post:
      operationId: runExpiry
      summary: >
        Run one incremental expiry sweep now (the background loop calls
        the same path). Bounded per run; never expires head; respects
        the consumer floor when enabled.
      parameters:
        - { $ref: "#/components/parameters/catalog" }
        - { $ref: "#/components/parameters/maintenanceBatch" }
      responses:
        "200":
          description: Sweep result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExpiryResult" }
        "404": { $ref: "#/components/responses/NotFound" }

  /catalogs/{catalog}/maintenance/cleanup:
    post:
      operationId: runCleanup
      summary: >
        Drain one batch of the file-removal queue. Every entry is
        liveness-checked against live references before physical
        deletion; still-referenced entries are skipped and counted (an
        invariant violation, never a deletion).
      parameters:
        - { $ref: "#/components/parameters/catalog" }
        - { $ref: "#/components/parameters/maintenanceBatch" }
      responses:
        "200":
          description: Drain result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CleanupResult" }
        "404": { $ref: "#/components/responses/NotFound" }

  /catalogs/{catalog}/namespaces/{namespace}/views:
    get:
      operationId: listViews
      parameters:
        - { $ref: "#/components/parameters/catalog" }
        - { $ref: "#/components/parameters/namespace" }
      responses:
        "200":
          description: Views live at head
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/View" }
    post:
      operationId: createView
      summary: Create a view (DDL commit; view SQL is stored verbatim with its dialect)
      parameters:
        - { $ref: "#/components/parameters/catalog" }
        - { $ref: "#/components/parameters/namespace" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, sql]
              properties:
                name: { type: string }
                sql: { type: string }
                dialect: { type: string, default: trino }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/View" }
        "409": { $ref: "#/components/responses/Conflict" }

  /catalogs/{catalog}/namespaces/{namespace}/views/{view}:
    get:
      operationId: getView
      parameters:
        - { $ref: "#/components/parameters/catalog" }
        - { $ref: "#/components/parameters/namespace" }
        - name: view
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: View
          content:
            application/json:
              schema: { $ref: "#/components/schemas/View" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: dropView
      parameters:
        - { $ref: "#/components/parameters/catalog" }
        - { $ref: "#/components/parameters/namespace" }
        - name: view
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Dropped; the snapshot that recorded it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommitResult" }
        "404": { $ref: "#/components/responses/NotFound" }

  /catalogs/{catalog}/snapshots:
    get:
      operationId: listSnapshots
      summary: Snapshots, paginated (never the full catalog in one response)
      parameters:
        - { $ref: "#/components/parameters/catalog" }
        - name: after
          in: query
          description: Return snapshots with id > after
          schema: { type: integer, format: int64, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, default: 1000, maximum: 10000 }
      responses:
        "200":
          description: Snapshot page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SnapshotPage" }
        "404": { $ref: "#/components/responses/NotFound" }

  /catalogs/{catalog}/commit:
    post:
      operationId: commit
      summary: >
        The append commit: register client-written parquet files with
        footer-derived stats. record_count is mandatory per file (row-id
        range assignment); column stats may be omitted (stats_mode=deferred)
        and are then hydrated asynchronously.
      parameters: [ { $ref: "#/components/parameters/catalog" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommitRequest" }
      responses:
        "200":
          description: Committed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommitResult" }
        "409":
          description: >
            Commit conflict (concurrent DDL on a touched table). The
            client refreshes its read snapshot and retries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "422":
          description: Validation failure (unknown table, bad stats shape,
            unknown field ids)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }

  # ---- CDC publications (SPECIFIED, NOT YET IMPLEMENTED: all return 501) ----
  # The WAL tap: a catalog-managed publication tails a table's changefeed
  # and produces its rows directly to Kafka. The publisher's progress is a
  # first-class consumer offset (consumer_id "publication:{name}"), so the
  # retention floor protects an unpublished range exactly as it protects
  # any lagging consumer. Delivery is at-least-once; records are keyed by
  # (table_uuid, row_id) so compacted topics converge. Deletes are emitted
  # from deletion-vector diffs as tombstone-shaped records.
  /catalogs/{catalog}/publications:
    get:
      operationId: listPublications
      parameters: [ { $ref: "#/components/parameters/catalog" } ]
      responses:
        "200":
          description: Publications
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Publication" }
        "501": { $ref: "#/components/responses/NotImplemented" }
    post:
      operationId: createPublication
      parameters: [ { $ref: "#/components/parameters/catalog" } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePublicationRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Publication" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /catalogs/{catalog}/publications/{publication}:
    get:
      operationId: getPublication
      parameters:
        - { $ref: "#/components/parameters/catalog" }
        - name: publication
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Publication with live status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Publication" }
        "501": { $ref: "#/components/responses/NotImplemented" }
    delete:
      operationId: dropPublication
      parameters:
        - { $ref: "#/components/parameters/catalog" }
        - name: publication
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Removed (its consumer offset is released) }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /catalogs/{catalog}/consumers/{consumer}/offsets:
    get:
      operationId: listConsumerOffsets
      parameters:
        - { $ref: "#/components/parameters/catalog" }
        - { $ref: "#/components/parameters/consumer" }
      responses:
        "200":
          description: Offsets for this consumer
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ConsumerOffset" }
        "404": { $ref: "#/components/responses/NotFound" }

  /catalogs/{catalog}/consumers/{consumer}/offsets/{tableUuid}:
    put:
      operationId: commitConsumerOffset
      summary: >
        Commit a consumer offset. Monotonic: a snapshot below the stored
        offset is rejected with 409.
      parameters:
        - { $ref: "#/components/parameters/catalog" }
        - { $ref: "#/components/parameters/consumer" }
        - name: tableUuid
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [snapshot_id]
              properties:
                snapshot_id: { type: integer, format: int64 }
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConsumerOffset" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

components:
  parameters:
    catalog:
      name: catalog
      in: path
      required: true
      schema: { type: string }
    namespace:
      name: namespace
      in: path
      required: true
      schema: { type: string }
    table:
      name: table
      in: path
      required: true
      schema: { type: string }
    consumer:
      name: consumer
      in: path
      required: true
      schema: { type: string }
    snapshot:
      name: snapshot
      in: query
      required: false
      description: Time travel; defaults to head. Mutually exclusive
        with at_timestamp.
      schema: { type: integer, format: int64 }
    atTimestamp:
      name: at_timestamp
      in: query
      required: false
      description: >
        Time travel by timestamp (ISO-8601 instant WITH a UTC offset,
        e.g. 2026-09-05T00:00:00Z; an offset-less local datetime is a
        400 bad_request): resolves to the largest snapshot with
        snapshot_time <= at_timestamp. Mutually exclusive with snapshot
        (422 if both). Before the earliest retained snapshot -> 410;
        after head -> head.
      schema: { type: string, format: date-time }
    maintenanceBatch:
      name: batch
      in: query
      required: false
      description: Per-run bound override (expire default 10000
        snapshots, cleanup default 2000 queue entries).
      schema: { type: integer }

  responses:
    NotImplemented:
      description: Specified but not yet implemented.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Gone:
      description: >
        The requested snapshot (or resolved timestamp) is below the
        expiry floor — that history has been expired. Re-read at a
        retained snapshot.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Conflict:
      description: Conflict
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }

  schemas:
    ApiError:
      type: object
      required: [error]
      properties:
        error: { type: string }
        detail: { type: string }

    Catalog:
      type: object
      required: [name, data_path, head_snapshot_id, schema_version]
      properties:
        name: { type: string }
        data_path: { type: string }
        head_snapshot_id: { type: integer, format: int64 }
        schema_version: { type: integer, format: int64 }

    CreateCatalogRequest:
      type: object
      required: [name, data_path]
      properties:
        name: { type: string }
        data_path: { type: string }

    Namespace:
      type: object
      required: [name]
      properties:
        name: { type: string }

    ColumnDef:
      type: object
      required: [name, type]
      properties:
        name: { type: string }
        type:
          type: string
          enum: [boolean, int, long, float, double, decimal, date, time,
                 timestamp, timestamptz, string, uuid, binary]
        type_params:
          type: object
          additionalProperties: true
        nullable: { type: boolean, default: true }

    Column:
      allOf:
        - $ref: "#/components/schemas/ColumnDef"
        - type: object
          required: [field_id, ordinal]
          properties:
            field_id: { type: integer, format: int64 }
            ordinal: { type: integer }

    CreateTableRequest:
      type: object
      required: [name, columns]
      properties:
        name: { type: string }
        columns:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ColumnDef" }

    TableSummary:
      type: object
      required: [name, table_uuid]
      properties:
        name: { type: string }
        table_uuid: { type: string, format: uuid }

    Table:
      type: object
      required: [name, namespace, table_uuid, columns, record_count,
                 file_count, file_size_bytes]
      properties:
        name: { type: string }
        namespace: { type: string }
        table_uuid: { type: string, format: uuid }
        columns:
          type: array
          items: { $ref: "#/components/schemas/Column" }
        record_count: { type: integer, format: int64 }
        file_count: { type: integer, format: int64 }
        file_size_bytes: { type: integer, format: int64 }
        partition_spec: { $ref: "#/components/schemas/PartitionSpec" }

    ColumnStats:
      type: object
      required: [field_id, value_count, null_count]
      properties:
        field_id: { type: integer, format: int64 }
        value_count: { type: integer, format: int64 }
        null_count: { type: integer, format: int64 }
        nan_count: { type: integer, format: int64 }
        size_bytes: { type: integer, format: int64 }
        lower_bound:
          type: string
          format: byte
          description: Iceberg single-value binary serialization, base64.
        upper_bound:
          type: string
          format: byte

    FileRegistration:
      type: object
      required: [path, record_count, file_size_bytes]
      properties:
        path: { type: string, description: Absolute object-store URI }
        record_count: { type: integer, format: int64 }
        file_size_bytes: { type: integer, format: int64 }
        footer_size: { type: integer, format: int64 }
        column_stats:
          type: array
          description: Omit for deferred stats (file registers as pending).
          items: { $ref: "#/components/schemas/ColumnStats" }
        partition_values:
          type: array
          description: >
            Transformed partition values by key_index of the table's live
            spec. Required with matching arity when the table is
            partitioned; forbidden when not.
          items: { type: string, nullable: true }

    TableAppend:
      type: object
      required: [namespace, table, files]
      properties:
        namespace: { type: string }
        table: { type: string }
        files:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/FileRegistration" }

    CommitRequest:
      type: object
      description: At least one of appends/deletes must be non-empty.
      properties:
        read_snapshot:
          type: integer
          format: int64
          description: >
            The snapshot the writer planned against. Conflicts are
            evaluated against changes after this point. Defaults to head
            (no conflict window) for blind appends. REQUIRED when
            deletes are present (deletes always conflict-check).
        appends:
          type: array
          items: { $ref: "#/components/schemas/TableAppend" }
        deletes:
          type: array
          items: { $ref: "#/components/schemas/TableDeletes" }
        author: { type: string }
        message: { type: string }

    DeleteFileRegistration:
      type: object
      required: [data_file_id, path, delete_count, file_size_bytes]
      properties:
        data_file_id: { type: integer, format: int64 }
        path: { type: string, description: Puffin deletion-vector file URI }
        delete_count:
          type: integer
          format: int64
          description: >
            Total deleted positions in the DV. Must be >= the superseded
            DV's count (vectors only grow) and <= the data file's
            record_count.
        file_size_bytes: { type: integer, format: int64 }

    TableDeletes:
      type: object
      required: [namespace, table, files]
      properties:
        namespace: { type: string }
        table: { type: string }
        files:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/DeleteFileRegistration" }

    DeleteFile:
      type: object
      required: [delete_file_id, data_file_id, path, file_format,
                 delete_count, file_size_bytes, begin_snapshot]
      properties:
        delete_file_id: { type: integer, format: int64 }
        data_file_id: { type: integer, format: int64 }
        path: { type: string }
        file_format: { type: string, enum: [puffin-dv] }
        delete_count: { type: integer, format: int64 }
        file_size_bytes: { type: integer, format: int64 }
        begin_snapshot: { type: integer, format: int64 }

    ScanFile:
      type: object
      required: [data_file]
      properties:
        data_file: { $ref: "#/components/schemas/DataFile" }
        delete_file: { $ref: "#/components/schemas/DeleteFile" }

    PartitionField:
      type: object
      required: [source_field_id, transform]
      properties:
        source_field_id: { type: integer, format: int64 }
        transform:
          type: string
          enum: [identity, bucket, year, month, day, hour]
        transform_param:
          type: integer
          description: bucket(n) only.

    PartitionSpec:
      type: object
      required: [spec_id, fields]
      properties:
        spec_id: { type: integer, format: int64 }
        fields:
          type: array
          items: { $ref: "#/components/schemas/PartitionField" }

    AlterOp:
      type: object
      required: [op]
      description: Discriminated by `op`.
      properties:
        op:
          type: string
          enum: [add_column, drop_column, rename_column, promote_column,
                 rename_table, set_partition_spec]
        column: { $ref: "#/components/schemas/ColumnDef" }   # add_column
        name: { type: string }        # drop_column, promote_column
        from: { type: string }        # rename_column
        to: { type: string }          # rename_column; promote_column target type
        new_name: { type: string }    # rename_table
        fields:                       # set_partition_spec ([] = unpartitioned)
          type: array
          items: { $ref: "#/components/schemas/PartitionField" }

    CommitResult:
      type: object
      required: [snapshot_id]
      properties:
        snapshot_id: { type: integer, format: int64 }
        schema_version: { type: integer, format: int64 }

    DataFile:
      type: object
      required: [data_file_id, path, file_format, record_count,
                 file_size_bytes, row_id_start, stats_state, begin_snapshot]
      properties:
        data_file_id: { type: integer, format: int64 }
        path: { type: string }
        file_format: { type: string }
        record_count: { type: integer, format: int64 }
        file_size_bytes: { type: integer, format: int64 }
        footer_size: { type: integer, format: int64 }
        row_id_start: { type: integer, format: int64 }
        stats_state: { type: string, enum: [provided, pending, failed] }
        begin_snapshot: { type: integer, format: int64 }
        spec_id: { type: integer, format: int64 }
        partition_values:
          type: array
          items: { type: string, nullable: true }

    ChangePlan:
      type: object
      required: [table_uuid, from_snapshot, to_snapshot, files, delete_files]
      properties:
        table_uuid: { type: string, format: uuid }
        from_snapshot: { type: integer, format: int64 }
        to_snapshot: { type: integer, format: int64 }
        files:
          type: array
          items: { $ref: "#/components/schemas/DataFile" }
        delete_files:
          type: array
          description: DVs registered in (from, to] — the deletions feed.
          items: { $ref: "#/components/schemas/DeleteFile" }

    View:
      type: object
      required: [name, namespace, view_uuid, dialect, sql]
      properties:
        name: { type: string }
        namespace: { type: string }
        view_uuid: { type: string, format: uuid }
        dialect: { type: string }
        sql: { type: string }

    CatalogOptions:
      type: object
      required: [consumer_floor, earliest_snapshot_id]
      properties:
        snapshot_retention_seconds:
          type: integer
          format: int64
          nullable: true
        consumer_floor: { type: boolean }
        earliest_snapshot_id: { type: integer, format: int64 }

    ExpiryResult:
      type: object
      required: [snapshots_expired, data_files_queued, delete_files_queued,
                 new_earliest_snapshot_id]
      properties:
        snapshots_expired: { type: integer, format: int64 }
        data_files_queued: { type: integer, format: int64 }
        delete_files_queued: { type: integer, format: int64 }
        new_earliest_snapshot_id: { type: integer, format: int64 }
        floored_by_consumer:
          type: string
          description: Consumer id pinning the floor, when the sweep was capped.

    CleanupResult:
      type: object
      required: [removed, missing, still_referenced]
      properties:
        removed: { type: integer, format: int64 }
        missing: { type: integer, format: int64 }
        still_referenced: { type: integer, format: int64 }

    Snapshot:
      type: object
      required: [snapshot_id, snapshot_time, schema_version]
      properties:
        snapshot_id: { type: integer, format: int64 }
        snapshot_time: { type: string, format: date-time }
        schema_version: { type: integer, format: int64 }
        author: { type: string }
        message: { type: string }
        changes:
          type: array
          items:
            type: object
            required: [kind]
            properties:
              kind: { type: string }
              object_id: { type: integer, format: int64 }

    SnapshotPage:
      type: object
      required: [snapshots, has_more]
      properties:
        snapshots:
          type: array
          items: { $ref: "#/components/schemas/Snapshot" }
        has_more: { type: boolean }

    KafkaSink:
      type: object
      required: [type, bootstrap_servers, topic]
      properties:
        type: { type: string, enum: [kafka] }
        bootstrap_servers: { type: string }
        topic: { type: string }
        format:
          type: string
          enum: [arrow_ipc, json]
          default: arrow_ipc
          description: >
            arrow_ipc: one record per Arrow IPC batch (efficient, typed).
            json: one record per row (envelope
            {op, snapshot_id, row_id, columns...}; deletes carry op +
            row_id only).

    CreatePublicationRequest:
      type: object
      required: [name, namespace, table, sink]
      properties:
        name: { type: string }
        namespace: { type: string }
        table: { type: string }
        sink: { $ref: "#/components/schemas/KafkaSink" }
        from_snapshot:
          type: integer
          format: int64
          description: Start point; defaults to head at creation time.

    Publication:
      type: object
      required: [name, table_uuid, sink, state, committed_snapshot]
      properties:
        name: { type: string }
        table_uuid: { type: string, format: uuid }
        sink: { $ref: "#/components/schemas/KafkaSink" }
        state:
          type: string
          enum: [pending, active, halted]
        committed_snapshot: { type: integer, format: int64 }
        lag_snapshots: { type: integer, format: int64 }
        last_error: { type: string }

    ConsumerOffset:
      type: object
      required: [consumer_id, table_uuid, committed_snapshot, updated_at]
      properties:
        consumer_id: { type: string }
        table_uuid: { type: string, format: uuid }
        committed_snapshot: { type: integer, format: int64 }
        updated_at: { type: string, format: date-time }
